name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript packages ──────────────────────────────────────────────
  type-check-ts:
    name: Type-check TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @veo3/contracts build

      - name: Build db package
        run: pnpm --filter @veo3/db build

      - name: Type-check web
        run: pnpm --filter @veo3/web type-check

      - name: Type-check media
        run: pnpm --filter @veo3/media type-check

  # ── Next.js build ───────────────────────────────────────────────────
  build-web:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: type-check-ts
    env:
      # Provide all required env vars with safe dummy values for build
      API_BASE_URL: http://localhost:8000
      WEB_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @veo3/contracts build

      - name: Build web
        run: pnpm --filter @veo3/web build

  # ── Media service build ─────────────────────────────────────────────
  build-media:
    name: Build media service
    runs-on: ubuntu-latest
    needs: type-check-ts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @veo3/contracts build

      - name: Build media service
        run: pnpm --filter @veo3/media build

  # ── Python / FastAPI ────────────────────────────────────────────────
  lint-api:
    name: Lint & type-check API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install dev tools
        run: pip install pyright ruff

      - name: Ruff lint
        run: ruff check apps/api/

      - name: Pyright type-check
        run: pyright apps/api/
        continue-on-error: true  # advisory only until strict mode is fully adopted

  # ── Docker build smoke test ─────────────────────────────────────────
  docker-build:
    name: Docker build (all images)
    runs-on: ubuntu-latest
    needs: [build-web, build-media, lint-api]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: veo3-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build media image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/media.Dockerfile
          push: false
          tags: veo3-media:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: veo3-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
